[package]
name = "bopen"
version = "0.1.0"
edition = "2024"
description = "Route every link you click on macOS to the right browser, profile, or app"
license = "MIT"

# Every dependency earns its place:
#   objc2 + objc2-foundation + objc2-app-kit + block2 : run loop, Apple Events, NSWorkspace
#   toml + serde                                      : config parse and validation
#   toml_edit                                         : comment-preserving config writes (menu bar)
#   serde_json                                        : Chromium "Local State" profile lookup
# Deliberately absent: clap, chrono, regex, url, notify, log/tracing.
[dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSString", "NSURL", "NSArray",
  "NSError", "NSObject", "NSRunLoop", "NSDate", "NSBundle", "NSEnumerator", "block2",
  "NSNotification", "NSDistributedNotificationCenter", "NSIndexSet", "NSGeometry",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "NSApplication", "NSRunningApplication", "NSWorkspace", "NSEvent", "NSResponder",
  "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView",
  "NSMenu", "NSMenuItem", "NSImage", "NSCell", "block2", "libc", "objc2-core-foundation",
  "NSWindow", "NSTabView", "NSTabViewItem", "NSTableView", "NSTableColumn", "NSScrollView",
  "NSClipView", "NSTextField", "NSComboBox", "NSFont", "NSColor", "NSText", "NSGraphics",
  "NSActionCell", "NSTextFieldCell", "NSComboBoxCell", "NSButtonCell", "NSUserInterfaceLayout",
  "NSUserInterfaceItemIdentification", "NSTableHeaderView", "NSFontDescriptor",
] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
